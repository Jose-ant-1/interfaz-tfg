server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Esto es lo más importante:
        # Si no encuentra el archivo, redirige a index.html (regla de Angular)
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Proxy para la API (para no tener líos de CORS)
    location /api/ {
        proxy_pass http://backend:8080/api/;
    }
}
