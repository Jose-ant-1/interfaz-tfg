<div class="min-h-screen bg-slate-50 p-6 md:p-12">
  <div class="max-w-4xl mx-auto">
    <header class="mb-10">
      <h1 class="text-4xl font-black text-slate-900 tracking-tight uppercase italic">
        Solicitud <span class="text-blue-600">Personalizada</span>
      </h1>
    </header>

    <div class="bg-white rounded-[3rem] shadow-xl border border-slate-100 p-8 md:p-12">
      <form (ngSubmit)="enviarSolicitud()" class="space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-2">Tipo de Servicio</label>
            <select [(ngModel)]="solicitud.tipoServicio" name="tipoServicio" class="w-full bg-slate-50 rounded-2xl p-4 outline-none font-bold">
              <option value="IMPRESION_3D">Impresión 3D</option>
              <option value="DISENYO_CAD">Diseño CAD</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-2">Acabado</label>
            <input type="text" [(ngModel)]="solicitud.acabado" name="acabado" placeholder="Ej: Bruto, Lijado..."
                   class="w-full bg-slate-50 rounded-2xl p-4 outline-none font-bold">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-2">Material</label>
            <select [(ngModel)]="solicitud.material" name="material" class="w-full bg-slate-50 rounded-2xl p-4 outline-none font-bold">
              <option [ngValue]="undefined">Seleccionar...</option>
              @for (m of materiales(); track m.id) {
                <option [ngValue]="m">{{ m.nombreMaterial }}</option>
              }
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-2">Tecnología</label>
            <select [(ngModel)]="solicitud.tecnologia" name="tecnologia" class="w-full bg-slate-50 rounded-2xl p-4 outline-none font-bold">
              <option [ngValue]="undefined">Seleccionar...</option>
              @for (t of tecnologias(); track t.id) {
                <option [ngValue]="t">{{ t.nombre }}</option>
              }
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-2">Descripción</label>
          <textarea [(ngModel)]="solicitud.descripcion" name="descripcion" rows="4"
                    class="w-full bg-slate-50 rounded-2xl p-4 outline-none font-medium"></textarea>
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-2">Requisitos Especiales</label>
          <textarea [(ngModel)]="solicitud.requisitosEspeciales" name="requisitosEspeciales" rows="2"
                    class="w-full bg-slate-50 rounded-2xl p-4 outline-none font-medium"></textarea>
        </div>



        <button type="submit" [disabled]="!solicitud.descripcion || cargando()"
                class="w-full bg-slate-900 text-white py-6 rounded-2xl font-black uppercase hover:bg-blue-600 transition-all">
          {{ cargando() ? 'Enviando...' : 'Confirmar Solicitud' }}
        </button>
      </form>
    </div>
  </div>
</div>
