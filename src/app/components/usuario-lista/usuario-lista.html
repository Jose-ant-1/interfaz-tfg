<div class="min-h-screen bg-slate-50 p-8">
  <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">Gestión de Usuarios</h1>

      <a routerLink="/admin/usuarios/nuevo"
         class="bg-blue-600 hover:bg-slate-900 text-white px-6 py-3 rounded-2xl font-black uppercase text-sm transition-all shadow-lg shadow-blue-200">
        + Nuevo Usuario
      </a>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead class="bg-slate-900 text-white text-sm uppercase tracking-wider">
        <tr>
          <th class="p-4">Nombre</th>
          <th class="p-4">Email</th>
          <th class="p-4">Ciudad</th>
          <th class="p-4">Rol</th>
          <th class="p-4">Estado</th>
          <th class="p-4 text-center">Acciones</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (u of usuarioService.usuarios(); track u.id) {
            <tr class="hover:bg-slate-50 transition-colors">
              <td class="p-4 font-bold text-slate-700">{{ u.nombre }} {{ u.apellidos }}</td>
              <td class="p-4 text-sm text-slate-500">{{ u.email }}</td>
              <td class="p-4 text-sm">{{ u.ciudad }}</td>
              <td class="p-4">
                <span [class]="'px-2 py-1 rounded text-[10px] font-black ' +
                  (u.rol === 'ADMIN' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700')">
                  {{ u.rol }}
                </span>
              </td>
              <td class="p-4">
                <span [class]="'px-2 py-1 rounded text-[10px] font-black ' +
                  (u.estado === 'ACTIVO' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700')">
                  {{ u.estado }}
                </span>
              </td>
              <td class="p-4 text-center">
                <div class="flex justify-center gap-2">
                  <a [routerLink]="['/admin/usuarios', u.id, 'editar']"
                     class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                  </a>
                  <button (click)="borrarUsuario(u.id)" class="p-2 text-red-600 hover:bg-red-50 rounded-lg">Eliminar</button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
