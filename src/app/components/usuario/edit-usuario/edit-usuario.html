<div class="min-h-screen bg-slate-50 p-6 md:p-12">
  <div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-2xl font-black text-slate-900 uppercase italic">
        {{ usuario()?.id === 0 ? 'Crear Nuevo Usuario' : 'Editar Perfil de Usuario' }}
      </h1>
      <a routerLink="/admin/usuarios" class="text-slate-500 hover:text-blue-600 font-bold">Volver</a>
    </div>

    @if (usuario()) {
      <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
        <form #userForm="ngForm" (ngSubmit)="guardar()" class="space-y-6">

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-black text-slate-400 uppercase mb-2">Nombre</label>
              <input type="text" [(ngModel)]="usuario()!.nombre" name="nombre" required
                     class="w-full bg-slate-50 rounded-xl p-4 outline-none focus:ring-2 focus:ring-purple-500">
            </div>
            <div>
              <label class="block text-xs font-black text-slate-400 uppercase mb-2">Apellidos</label>
              <input type="text" [(ngModel)]="usuario()!.apellidos" name="apellidos" required
                     class="w-full bg-slate-50 rounded-xl p-4 outline-none focus:ring-2 focus:ring-purple-500">
            </div>
          </div>

          <div>
            <label class="block text-xs font-black text-slate-400 uppercase mb-2">Email</label>
            <input type="email" [(ngModel)]="usuario()!.email" name="email" required email
                   [disabled]="usuario()?.id !== 0"
                   [class.bg-slate-100]="usuario()?.id !== 0"
                   class="w-full bg-slate-50 rounded-xl p-4 outline-none focus:ring-2 focus:ring-purple-500">
          </div>

          @if (usuario()?.id === 0) {
            <div class="bg-green-50 p-4 rounded-xl border border-green-100">
              <label class="block text-xs font-black text-green-700 uppercase mb-2">Contraseña Temporal</label>
              <input type="password" [(ngModel)]="usuario()!.contrasenia" name="pass" required minlength="4"
                     class="w-full bg-white rounded-xl p-4 outline-none focus:ring-2 focus:ring-green-500">
              <p class="text-[10px] text-green-600 mt-1 italic">* Mínimo 4 caracteres. El usuario deberá cambiarla al entrar.</p>
            </div>
          }

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-black text-slate-400 uppercase mb-2">Rol</label>
              <select [(ngModel)]="usuario()!.rol" name="rol" class="w-full bg-slate-50 rounded-xl p-4 outline-none">
                <option value="ADMIN">ADMIN</option>
                <option value="CLIENTE">CLIENTE</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-black text-slate-400 uppercase mb-2">Estado</label>
              <select [(ngModel)]="usuario()!.estado" name="estado" class="w-full bg-slate-50 rounded-xl p-4 outline-none">
                <option value="ACTIVO">ACTIVO</option>
                <option value="INACTIVO">INACTIVO</option>
              </select>
            </div>
          </div>

          <button type="submit"
                  [disabled]="userForm.invalid"
                  [class.opacity-50]="userForm.invalid"
                  [class.cursor-not-allowed]="userForm.invalid"
                  class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase shadow-lg hover:bg-purple-600 transition-all">
            {{ usuario()?.id === 0 ? 'Crear Usuario' : 'Guardar Cambios' }}
          </button>

        </form>
      </div>
    } @else {
      <div class="text-center p-10">
        <p class="text-slate-400 animate-pulse">Cargando datos del usuario...</p>
      </div>
    }
  </div>
</div>
