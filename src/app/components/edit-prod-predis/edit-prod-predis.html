<div class="min-h-screen bg-slate-50 p-6 md:p-12">
  <div class="max-w-3xl mx-auto">

    <div class="flex items-center justify-between mb-8">
      <a [routerLink]="['/productos', producto()?.id]" class="text-slate-500 hover:text-blue-600 font-bold flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        Cancelar
      </a>
      <h1 class="text-2xl font-black text-slate-900 uppercase italic">
        {{ producto()?.id ? 'Editar Producto' : 'Nuevo Producto' }}
      </h1>
    </div>

    @if (producto()) {
      <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8">
        <form (ngSubmit)="guardarCambios()" class="space-y-6">

          <div class="bg-slate-50 p-6 rounded-2xl border-2 border-dashed border-slate-200">
            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Imagen del Producto (URL)</label>

            <div class="flex flex-col md:flex-row gap-6 items-center">
              <div class="w-32 h-32 bg-white rounded-xl border border-slate-200 overflow-hidden flex items-center justify-center relative shadow-inner shrink-0">
                @if (producto().imagenUrl) {
                  <img [src]="producto().imagenUrl"
                       class="object-contain w-full h-full p-2"
                       alt="Preview"
                       (error)="producto().imagenUrl = ''">
                } @else {
                  <div class="text-center">
                    <svg class="w-8 h-8 mx-auto text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                  </div>
                }
              </div>

              <div class="w-full">
                <input type="text" [(ngModel)]="producto().imagenUrl" name="imagenUrl"
                       placeholder="Pega aquí la URL de la imagen..."
                       class="w-full bg-white border border-slate-200 rounded-xl p-4 focus:ring-2 focus:ring-blue-500 outline-none font-medium text-slate-600 text-sm">
                <p class="mt-2 text-[10px] text-slate-400 font-bold uppercase tracking-wider">La imagen se actualizará automáticamente al pegar un enlace válido.</p>
              </div>
            </div>
          </div>

          <hr class="border-slate-100 my-4">

          <div>
            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Nombre del Modelo</label>
            <input type="text" [(ngModel)]="producto().nombreProducto" name="nombre"
                   class="w-full bg-slate-50 border-none rounded-xl p-4 focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-700">
          </div>

          <div>
            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Descripción Técnica</label>
            <textarea [(ngModel)]="producto().descripcion" name="descripcion" rows="4"
                      class="w-full bg-slate-50 border-none rounded-xl p-4 focus:ring-2 focus:ring-blue-500 outline-none text-slate-600"></textarea>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Precio (€)</label>
              <input type="number" [(ngModel)]="producto().precio" name="precio"
                     class="w-full bg-slate-50 border-none rounded-xl p-4 focus:ring-2 focus:ring-blue-500 outline-none font-black text-blue-600 text-xl">
            </div>

            <div>
              <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Stock Disponible</label>
              <input type="number" [(ngModel)]="producto().stockDisponible" name="stock"
                     class="w-full bg-slate-50 border-none rounded-xl p-4 focus:ring-2 focus:ring-blue-500 outline-none font-bold">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Peso (Gramos)</label>
              <input type="number" [(ngModel)]="producto().pesoGramos" name="peso"
                     class="w-full bg-slate-50 border-none rounded-xl p-4 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="flex items-center gap-4 p-4 bg-slate-50 rounded-xl">
              <input type="checkbox" [(ngModel)]="producto().disponible" name="disponible" id="disp"
                     class="w-5 h-5 accent-blue-600">
              <label for="disp" class="text-sm font-bold text-slate-700 uppercase">Visible en catálogo</label>
            </div>
          </div>
          <div>
            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">
              Tiempo Impresión (min)
            </label>
            <input type="number" [(ngModel)]="producto().tiempoImpresionMinutos" name="tiempo"
                   class="w-full bg-slate-50 border-none rounded-xl p-4 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div class="pt-6">
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase tracking-tighter shadow-lg shadow-blue-200 hover:bg-slate-900 transition-all active:scale-95">
              {{ producto()?.id ? 'Actualizar Ficha de Producto' : 'Crear Nuevo Producto' }}
            </button>
          </div>

        </form>
      </div>
    } @else {
      <div class="flex justify-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      </div>
    }

  </div>
</div>
