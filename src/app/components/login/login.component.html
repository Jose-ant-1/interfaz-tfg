<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
    <div class="p-8">
      <form (submit)="onSubmit(); $event.preventDefault()" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
          <input type="email" name="email" [(ngModel)]="email"
                 class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none"
                 placeholder="ejemplo@correo.com" required>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
          <input type="password" name="password" [(ngModel)]="password"
                 class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none"
                 placeholder="••••••••" required>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-blue-500/30 transition-all active:scale-95">
          Entrar al Panel
        </button>
      </form>
    </div>
  </div>
</div>
