<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
    <div class="p-8">

      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Bienvenido</h2>
        <p class="text-slate-500 text-sm">Ingresa tus credenciales para acceder</p>
      </div>

      @if (errorMessage) {
        <div class="mb-5 p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm font-medium flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="Ref-Circle-X" />
          </svg>
          {{ errorMessage }}
        </div>
      }

      <form (submit)="onSubmit(); $event.preventDefault()" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
          <input type="email" name="email" [(ngModel)]="email" class="w-full px-4 py-3 rounded-lg border border-slate-200 outline-none" placeholder="ejemplo@correo.com" required>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
          <input type="password" name="password" [(ngModel)]="password" class="w-full px-4 py-3 rounded-lg border border-slate-200 outline-none" placeholder="••••••••" required>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition-all">
          Entrar
        </button>

        <div class="text-center pt-4 border-t border-slate-100">
          <p class="text-slate-600 text-sm">
            ¿No tienes una cuenta?
            <a routerLink="/registro" class="text-blue-600 font-bold hover:underline">Regístrate aquí</a>
          </p>
        </div>
      </form>

    </div>
  </div>
</div>
